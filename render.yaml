services:
  # 1. FastAPI Backend API
  - type: web
    name: codefort-api
    runtime: python
    rootDir: services/api
    buildCommand: uv pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: EXTENSION_TOKEN_SIGNING_KEY
        generateValue: true
      - key: ALLOWED_WEB_ORIGINS
        value: "https://codefort.vercel.app,chrome-extension://*"
      - key: DATABASE_URL
        fromDatabase:
          name: codefort-db
          property: connectionString

  # 2. Next.js Web Dashboard
  - type: web
    name: codefort-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: codefort-api
          property: host

databases:
  - name: codefort-db
    databaseName: codefort
    user: codefort_user
    plan: free
